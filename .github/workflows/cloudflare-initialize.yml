name: Initialize project Cloudflare resources
on:
  push:
    branches: [release/cloudflare]
    paths: ['scripts/cloudflare-provision.mjs', '.github/workflows/cloudflare-initialize.yml']
permissions:
  contents: read
concurrency:
  group: taiwan-startup-park-production-release
  cancel-in-progress: false
jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create only project D1 and deny-by-default Access application
        run: node scripts/cloudflare-provision.mjs
      - run: npm ci
      - name: Apply project schema without demo data
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.infrastructure.json
      - name: Record schema verification
        run: npx wrangler d1 migrations list DB --remote --config wrangler.infrastructure.json
      - name: Save non-secret project resource mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-resource-mapping
          path: deployment-resources.json
          if-no-files-found: ignore

name: Platform acceptance
on:
  push:
    branches: [feature/foundation, feature/line-integration, feature/tenant-operations, feature/phase1-address-scope, feature/workspace-performance, feature/tenant-service-clarity, feature/mail-line-notifications, feature/line-oa-settings, feature/platform-console, feature/line-login-settings, feature/line-account-settings, feature/line-workspace, feature/chat-monitor-import, feature/full-platform-migration]
    paths-ignore:
      - 'platform/upstream-smart-menu/**'
      - 'config/platform-source-lock.json'
      - 'scripts/verify-upstream-platform.mjs'
      - 'scripts/audit-upstream-platform.mjs'
      - 'scripts/repair-upstream-platform.mjs'
      - 'platform/dependency-overlays/**'
      - '.github/workflows/full-platform-baseline.yml'
      - 'docs/FULL_PLATFORM_MIGRATION.md'
  pull_request:
    branches: [main, docs/platform-blueprint, feature/foundation, feature/line-integration]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci
      - name: Dependency audit report
        run: |
          npm audit --audit-level=high
      - name: Typecheck and core permission tests
        run: |
          npm run typecheck
          npm test
      - name: Bundle Worker without deployment
        run: npm run worker:check
      - name: Install browser and Traditional Chinese font
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Browser acceptance and desktop/mobile screenshots
        run: npm run test:e2e
      - name: Export fictional workspace screenshots for review
        run: node scripts/export-workspace-screenshots.mjs
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-acceptance
          path: |
            docs/screenshots
            playwright-report
            test-results
            package-lock.json
            dist/public/tutorial
            docs/tutorial
          if-no-files-found: warn

name: Platform acceptance
on:
  push:
    branches: [feature/foundation, feature/line-integration, feature/tenant-operations, feature/phase1-address-scope]
  pull_request:
    branches: [main, docs/platform-blueprint, feature/foundation, feature/line-integration]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci
      - name: Dependency audit report
        run: |
          npm audit --audit-level=high
      - name: Typecheck and core permission tests
        run: |
          npm run typecheck
          npm test
      - name: Bundle Worker without deployment
        run: npm run worker:check
      - name: Install browser and Traditional Chinese font
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Browser acceptance and desktop/mobile screenshots
        run: npm run test:e2e
      - name: Record phase-one address tutorial without deployment
        run: |
          sudo apt-get install -y ffmpeg
          TUTORIAL_REHEARSAL=on node scripts/record-tutorial.mjs
          node scripts/record-tutorial.mjs
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-acceptance
          path: |
            docs/screenshots
            playwright-report
            test-results
            package-lock.json
            dist/public/tutorial
            docs/tutorial
          if-no-files-found: warn
